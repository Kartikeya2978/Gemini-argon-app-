          cat << 'EOF' > app/src/main/java/com/iitb/scheduletracker/MainActivity.kt
          @file:OptIn(ExperimentalMaterial3Api::class)

          package com.iitb.scheduletracker

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.os.*
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.animateColorAsState
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextDecoration
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.delay
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.*

          // --- 1. DATA MODELS & CUSTOMIZABLE CATEGORIES / THEMES ---
          data class ScheduleItem(
              val id: Int = (System.currentTimeMillis() % 100000000).toInt(),
              val title: String,
              val category: String,
              val location: String,
              val notes: String = "",
              val priority: String = "Normal",
              val eventTimeMillis: Long,
              val hour: Int,
              val minute: Int,
              val recurringDays: String = "",
              val isReminderActive: Boolean = true,
              val alert15MinPrior: Boolean = true,
              val isPinned: Boolean = false,
              val isCompleted: Boolean = false
          )

          data class CategorySpec(
              val name: String,
              val colorHex: Long
          )

          data class AppThemeSpec(
              val name: String,
              val primary: Color,
              val secondary: Color,
              val cardSurface: Color
          )

          val APP_THEMES = listOf(
              AppThemeSpec("One UI Cyber Blue", Color(0xFF387AFF), Color(0xFF00E5FF), Color(0xFF131622)),
              AppThemeSpec("Nebula Violet", Color(0xFF9D4EDD), Color(0xFFEC4899), Color(0xFF171224)),
              AppThemeSpec("Emerald Matrix", Color(0xFF10B981), Color(0xFF06B6D4), Color(0xFF101C1A)),
              AppThemeSpec("Sunset Stealth", Color(0xFFFF5E3A), Color(0xFFFFB703), Color(0xFF1F1414))
          )

          val CATEGORY_COLOR_PALETTE = listOf(
              0xFF387AFFL, // Electric Blue
              0xFF00E5FFL, // Neon Cyan
              0xFFA855F7L, // Cyber Purple
              0xFF10B981L, // Emerald Mint
              0xFFFF9F0AL, // Amber Gold
              0xFFFF453AL, // Crimson Red
              0xFFEC4899L, // Neon Rose
              0xFF6366F1L  // Indigo Glow
          )

          val DEFAULT_CATEGORIES = listOf(
              CategorySpec("AUV Tech Team", 0xFF00E5FFL),
              CategorySpec("Makerspace", 0xFFFF9F0AL),
              CategorySpec("Aeromodelling", 0xFFA855F7L),
              CategorySpec("IITB Meetings", 0xFF387AFFL),
              CategorySpec("Classes & Labs", 0xFF10B981L),
              CategorySpec("Orientations", 0xFFEC4899L),
              CategorySpec("Tasks", 0xFF6366F1L)
          )

          val DEFAULT_VENUES = listOf(
              "AUV Lab", "Makerspace", "Hostel 16", "LA 201",
              "LHC", "Tinkerers' Lab", "Gymkhana", "Convocation Hall"
          )

          object OfflineStore {
              private const val PREF_NAME = "iitb_schedule_pro_store"
              private const val KEY_ITEMS = "schedule_json"
              private const val KEY_CATEGORIES = "custom_categories_v1"
              private const val KEY_VENUES = "custom_venues_v1"
              private const val KEY_THEME = "selected_theme_idx"

              fun getThemeIndex(context: Context): Int {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  return prefs.getInt(KEY_THEME, 0).coerceIn(0, APP_THEMES.lastIndex)
              }

              fun saveThemeIndex(context: Context, index: Int) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putInt(KEY_THEME, index).apply()
              }

              fun getCategories(context: Context): List<CategorySpec> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val raw = prefs.getString(KEY_CATEGORIES, null) ?: return DEFAULT_CATEGORIES
                  val list = mutableListOf<CategorySpec>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val name = o.optString("name", "").trim()
                          val color = o.optLong("colorHex", 0xFF387AFFL)
                          if (name.isNotEmpty()) list.add(CategorySpec(name, color))
                      }
                  } catch (_: Exception) {}
                  return if (list.isEmpty()) DEFAULT_CATEGORIES else list
              }

              fun saveCategories(context: Context, categories: List<CategorySpec>) {
                  val arr = JSONArray()
                  categories.forEach { c ->
                      arr.put(JSONObject().apply {
                          put("name", c.name)
                          put("colorHex", c.colorHex)
                      })
                  }
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_CATEGORIES, arr.toString()).apply()
              }

              fun getVenues(context: Context): List<String> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val raw = prefs.getString(KEY_VENUES, null) ?: return DEFAULT_VENUES
                  val list = mutableListOf<String>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val v = arr.optString(i, "").trim()
                          if (v.isNotEmpty()) list.add(v)
                      }
                  } catch (_: Exception) {}
                  return if (list.isEmpty()) DEFAULT_VENUES else list
              }

              fun saveVenues(context: Context, venues: List<String>) {
                  val arr = JSONArray()
                  venues.forEach { arr.put(it) }
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_VENUES, arr.toString()).apply()
              }

              fun getAll(context: Context): List<ScheduleItem> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val raw = prefs.getString(KEY_ITEMS, "[]") ?: "[]"
                  val list = mutableListOf<ScheduleItem>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(
                              ScheduleItem(
                                  id = o.optInt("id", i + 1),
                                  title = o.optString("title", "Event"),
                                  category = o.optString("category", "Classes & Labs"),
                                  location = o.optString("location", "IITB Campus"),
                                  notes = o.optString("notes", ""),
                                  priority = o.optString("priority", "Normal"),
                                  eventTimeMillis = o.optLong("eventTimeMillis", System.currentTimeMillis()),
                                  hour = o.optInt("hour", 12),
                                  minute = o.optInt("minute", 0),
                                  recurringDays = o.optString("recurringDays", ""),
                                  isReminderActive = o.optBoolean("isReminderActive", true),
                                  alert15MinPrior = o.optBoolean("alert15MinPrior", true),
                                  isPinned = o.optBoolean("isPinned", false),
                                  isCompleted = o.optBoolean("isCompleted", false)
                              )
                          )
                      }
                  } catch (_: Exception) {}
                  return list.sortedWith(compareByDescending<ScheduleItem> { it.isPinned }.thenBy { it.eventTimeMillis })
              }

              fun saveAll(context: Context, items: List<ScheduleItem>) {
                  val arr = JSONArray()
                  items.forEach { item ->
                      arr.put(JSONObject().apply {
                          put("id", item.id)
                          put("title", item.title)
                          put("category", item.category)
                          put("location", item.location)
                          put("notes", item.notes)
                          put("priority", item.priority)
                          put("eventTimeMillis", item.eventTimeMillis)
                          put("hour", item.hour)
                          put("minute", item.minute)
                          put("recurringDays", item.recurringDays)
                          put("isReminderActive", item.isReminderActive)
                          put("alert15MinPrior", item.alert15MinPrior)
                          put("isPinned", item.isPinned)
                          put("isCompleted", item.isCompleted)
                      })
                  }
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY_ITEMS, arr.toString())
                      .apply()
              }
          }

          // --- 2. MULTI-STAGE ALARM ENGINE & SNOOZE RECEIVER ---
          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val action = intent.action
                  val id = intent.getIntExtra("ID", 0)
                  val title = intent.getStringExtra("TITLE") ?: "Upcoming Event"
                  val category = intent.getStringExtra("CATEGORY") ?: "taskz"
                  val location = intent.getStringExtra("LOCATION") ?: "Campus"
                  val notes = intent.getStringExtra("NOTES") ?: ""
                  val alertLabel = intent.getStringExtra("ALERT_LABEL") ?: "in 2 Hours"
                  val hour = intent.getIntExtra("HOUR", 12)
                  val minute = intent.getIntExtra("MINUTE", 0)
                  val recurringDays = intent.getStringExtra("RECURRING_DAYS") ?: ""
                  val currentEventMillis = intent.getLongExtra("EVENT_TIME", System.currentTimeMillis())

                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (action == "ACTION_SNOOZE_15M") {
                      manager.cancel(id)
                      AlarmScheduler.scheduleSnooze(context, id, title, category, location, notes)
                      return
                  }

                  val channelId = "taskz_pro_alerts"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "taskz 2-Hour & 15-Min Alerts",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply { enableVibration(true) }
                      manager.createNotificationChannel(channel)
                  }

                  val snoozeIntent = Intent(context, ReminderReceiver::class.java).apply {
                      this.action = "ACTION_SNOOZE_15M"
                      putExtra("ID", id)
                      putExtra("TITLE", title)
                      putExtra("CATEGORY", category)
                      putExtra("LOCATION", location)
                      putExtra("NOTES", notes)
                  }
                  val snoozePending = PendingIntent.getBroadcast(
                      context,
                      id * 100 + 99,
                      snoozeIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val bodyText = if (notes.isNotBlank()) "Venue: $location • $notes" else "Venue: $location"

                  val notification = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("[$category] $alertLabel: $title")
                      .setContentText(bodyText)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(bodyText))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .addAction(android.R.drawable.ic_popup_reminder, "Snooze 15m", snoozePending)
                      .setAutoCancel(true)
                      .build()

                  manager.notify(id, notification)

                  if (recurringDays.isNotBlank() && alertLabel == "in 2 Hours") {
                      val nextEventTime = AlarmScheduler.computeNextRecurringMillis(
                          hour = hour,
                          minute = minute,
                          recurringDaysCsv = recurringDays,
                          afterTimeMillis = currentEventMillis + 60_000L
                      )
                      val all = OfflineStore.getAll(context).toMutableList()
                      val idx = all.indexOfFirst { it.id == id }
                      if (idx >= 0) {
                          val updated = all[idx].copy(eventTimeMillis = nextEventTime)
                          all[idx] = updated
                          OfflineStore.saveAll(context, all)
                          AlarmScheduler.scheduleReminders(context, updated)
                      }
                  }
              }
          }

          class BootCompletedReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val now = System.currentTimeMillis()
                  val items = OfflineStore.getAll(context).toMutableList()
                  var changed = false
                  items.forEachIndexed { idx, item ->
                      if (item.isReminderActive && !item.isCompleted) {
                          if (item.recurringDays.isNotBlank()) {
                              val nextOccurrence = AlarmScheduler.computeNextRecurringMillis(
                                  hour = item.hour,
                                  minute = item.minute,
                                  recurringDaysCsv = item.recurringDays,
                                  afterTimeMillis = now
                              )
                              val updated = item.copy(eventTimeMillis = nextOccurrence)
                              items[idx] = updated
                              changed = true
                              AlarmScheduler.scheduleReminders(context, updated)
                          } else if (item.eventTimeMillis > now) {
                              AlarmScheduler.scheduleReminders(context, item)
                          }
                      }
                  }
                  if (changed) OfflineStore.saveAll(context, items)
              }
          }

          object AlarmScheduler {
              private const val TWO_HOURS_MILLIS = 2 * 60 * 60 * 1000L
              private const val FIFTEEN_MIN_MILLIS = 15 * 60 * 1000L

              fun computeNextRecurringMillis(
                  hour: Int,
                  minute: Int,
                  recurringDaysCsv: String,
                  afterTimeMillis: Long = System.currentTimeMillis()
              ): Long {
                  val activeDays = recurringDaysCsv.split(",")
                      .mapNotNull { it.trim().toIntOrNull() }
                      .toSet()
                  if (activeDays.isEmpty()) return afterTimeMillis

                  val cal = Calendar.getInstance().apply {
                      timeInMillis = afterTimeMillis
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }

                  for (offset in 0..7) {
                      val candidate = (cal.clone() as Calendar).apply {
                          add(Calendar.DAY_OF_YEAR, offset)
                      }
                      val dayOfWeek = candidate.get(Calendar.DAY_OF_WEEK)
                      if (dayOfWeek in activeDays && candidate.timeInMillis > afterTimeMillis) {
                          return candidate.timeInMillis
                      }
                  }
                  return cal.timeInMillis + 7 * 24 * 3600 * 1000L
              }

              fun scheduleReminders(context: Context, item: ScheduleItem) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val targetEventMillis = if (item.recurringDays.isNotBlank()) {
                      computeNextRecurringMillis(item.hour, item.minute, item.recurringDays)
                  } else {
                      item.eventTimeMillis
                  }

                  scheduleSingleAlarm(
                      context = context,
                      alarmManager = alarmManager,
                      requestCode = item.id * 10 + 1,
                      item = item,
                      targetEventMillis = targetEventMillis,
                      triggerMillis = targetEventMillis - TWO_HOURS_MILLIS,
                      alertLabel = "in 2 Hours",
                      enabled = item.isReminderActive && !item.isCompleted
                  )

                  scheduleSingleAlarm(
                      context = context,
                      alarmManager = alarmManager,
                      requestCode = item.id * 10 + 2,
                      item = item,
                      targetEventMillis = targetEventMillis,
                      triggerMillis = targetEventMillis - FIFTEEN_MIN_MILLIS,
                      alertLabel = "in 15 Mins",
                      enabled = item.isReminderActive && !item.isCompleted && item.alert15MinPrior
                  )
              }

              private fun scheduleSingleAlarm(
                  context: Context,
                  alarmManager: AlarmManager,
                  requestCode: Int,
                  item: ScheduleItem,
                  targetEventMillis: Long,
                  triggerMillis: Long,
                  alertLabel: String,
                  enabled: Boolean
              ) {
                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      putExtra("ID", item.id)
                      putExtra("TITLE", item.title)
                      putExtra("CATEGORY", item.category)
                      putExtra("LOCATION", item.location)
                      putExtra("NOTES", item.notes)
                      putExtra("ALERT_LABEL", alertLabel)
                      putExtra("HOUR", item.hour)
                      putExtra("MINUTE", item.minute)
                      putExtra("RECURRING_DAYS", item.recurringDays)
                      putExtra("EVENT_TIME", targetEventMillis)
                  }

                  val pendingIntent = PendingIntent.getBroadcast(
                      context,
                      requestCode,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  if (!enabled) {
                      alarmManager.cancel(pendingIntent)
                      return
                  }

                  val now = System.currentTimeMillis()
                  val finalTrigger = if (triggerMillis <= now && targetEventMillis > now && alertLabel == "in 2 Hours") {
                      now + 5_000L
                  } else {
                      triggerMillis
                  }

                  if (finalTrigger > now) {
                      try {
                          alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, finalTrigger, pendingIntent)
                      } catch (_: SecurityException) {
                          alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, finalTrigger, pendingIntent)
                      }
                  }
              }

              fun scheduleSnooze(
                  context: Context,
                  id: Int,
                  title: String,
                  category: String,
                  location: String,
                  notes: String
              ) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val triggerAt = System.currentTimeMillis() + FIFTEEN_MIN_MILLIS
                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      putExtra("ID", id)
                      putExtra("TITLE", title)
                      putExtra("CATEGORY", category)
                      putExtra("LOCATION", location)
                      putExtra("NOTES", notes)
                      putExtra("ALERT_LABEL", "Snoozed Alert")
                  }
                  val pending = PendingIntent.getBroadcast(
                      context,
                      id * 100 + 88,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  try {
                      alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pending)
                  } catch (_: SecurityException) {
                      alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pending)
                  }
              }
          }

          // --- 3. MAIN ACTIVITY & CYBER-AMOLED ONE UI 7 THEME ---
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                  }

                  setContent {
                      TaskzAppRoot()
                  }
              }
          }

          @Composable
          fun TaskzAppRoot() {
              val context = LocalContext.current
              var themeIndex by remember { mutableStateOf(OfflineStore.getThemeIndex(context)) }
              val currentTheme = APP_THEMES[themeIndex]

              var categories by remember { mutableStateOf(OfflineStore.getCategories(context)) }
              var venues by remember { mutableStateOf(OfflineStore.getVenues(context)) }
              var allItems by remember { mutableStateOf(OfflineStore.getAll(context)) }

              fun persistItems(updatedList: List<ScheduleItem>) {
                  val sorted = updatedList.sortedWith(compareByDescending<ScheduleItem> { it.isPinned }.thenBy { it.eventTimeMillis })
                  OfflineStore.saveAll(context, sorted)
                  allItems = sorted
              }

              fun persistCategories(updated: List<CategorySpec>) {
                  val safeList = if (updated.isEmpty()) DEFAULT_CATEGORIES else updated
                  OfflineStore.saveCategories(context, safeList)
                  categories = safeList
              }

              fun persistVenues(updated: List<String>) {
                  val safeVenues = if (updated.isEmpty()) DEFAULT_VENUES else updated
                  OfflineStore.saveVenues(context, safeVenues)
                  venues = safeVenues
              }

              var currentTab by remember { mutableStateOf(0) }
              var editingItem by remember { mutableStateOf<ScheduleItem?>(null) }
              var showAddOrEditDialog by remember { mutableStateOf(false) }
              var showCategoryDialog by remember { mutableStateOf(false) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF05060A),
                      surface = currentTheme.cardSurface,
                      primary = currentTheme.primary,
                      secondary = currentTheme.secondary,
                      onBackground = Color.White,
                      onSurface = Color.White
                  )
              ) {
                  Scaffold(
                      containerColor = Color(0xFF05060A),
                      floatingActionButton = {
                          if (currentTab == 0 || currentTab == 1) {
                              FloatingActionButton(
                                  onClick = {
                                      editingItem = null
                                      showAddOrEditDialog = true
                                  },
                                  containerColor = currentTheme.primary,
                                  contentColor = Color.White,
                                  shape = CircleShape
                              ) {
                                  Icon(Icons.Default.Add, contentDescription = "Add Event")
                              }
                          }
                      },
                      bottomBar = {
                          NavigationBar(
                              containerColor = Color(0xFF0B0D14),
                              contentColor = Color.White
                          ) {
                              NavigationBarItem(
                                  selected = currentTab == 0,
                                  onClick = { currentTab = 0 },
                                  icon = { Icon(Icons.Default.DateRange, contentDescription = null) },
                                  label = { Text("Schedule") }
                              )
                              NavigationBarItem(
                                  selected = currentTab == 1,
                                  onClick = { currentTab = 1 },
                                  icon = { Icon(Icons.Default.CheckCircle, contentDescription = null) },
                                  label = { Text("Tasks") }
                              )
                              NavigationBarItem(
                                  selected = currentTab == 2,
                                  onClick = { currentTab = 2 },
                                  icon = { Icon(Icons.Default.PlayArrow, contentDescription = null) },
                                  label = { Text("Focus & Lab") }
                              )
                              NavigationBarItem(
                                  selected = currentTab == 3,
                                  onClick = { currentTab = 3 },
                                  icon = { Icon(Icons.Default.Settings, contentDescription = null) },
                                  label = { Text("Customize") }
                              )
                          }
                      }
                  ) { padding ->
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(padding)
                      ) {
                          when (currentTab) {
                              0 -> ScheduleTabScreen(
                                  allItems = allItems,
                                  categories = categories,
                                  theme = currentTheme,
                                  onOpenCategoryManager = { showCategoryDialog = true },
                                  onCycleTheme = {
                                      val next = (themeIndex + 1) % APP_THEMES.size
                                      themeIndex = next
                                      OfflineStore.saveThemeIndex(context, next)
                                  },
                                  onEdit = { item ->
                                      editingItem = item
                                      showAddOrEditDialog = true
                                  },
                                  onToggleActive = { item, enabled ->
                                      val updated = item.copy(isReminderActive = enabled)
                                      persistItems(allItems.map { if (it.id == item.id) updated else it })
                                      AlarmScheduler.scheduleReminders(context, updated)
                                  },
                                  onTogglePin = { item ->
                                      val updated = item.copy(isPinned = !item.isPinned)
                                      persistItems(allItems.map { if (it.id == item.id) updated else it })
                                  },
                                  onDelete = { item ->
                                      AlarmScheduler.scheduleReminders(context, item.copy(isReminderActive = false))
                                      persistItems(allItems.filterNot { it.id == item.id })
                                  }
                              )
                              1 -> TasksChecklistScreen(
                                  allItems = allItems,
                                  categories = categories,
                                  theme = currentTheme,
                                  onToggleComplete = { item ->
                                      val completed = !item.isCompleted
                                      val updated = item.copy(
                                          isCompleted = completed,
                                          isReminderActive = if (completed) false else item.isReminderActive
                                      )
                                      persistItems(allItems.map { if (it.id == item.id) updated else it })
                                      AlarmScheduler.scheduleReminders(context, updated)
                                  },
                                  onClearCompleted = {
                                      persistItems(allItems.filterNot { it.isCompleted })
                                  },
                                  onEdit = { item ->
                                      editingItem = item
                                      showAddOrEditDialog = true
                                  }
                              )
                              2 -> FocusAndStopwatchScreen(theme = currentTheme)
                              3 -> CustomizeAndBackupScreen(
                                  allItems = allItems,
                                  categories = categories,
                                  themeIndex = themeIndex,
                                  theme = currentTheme,
                                  onSelectTheme = { idx ->
                                      themeIndex = idx
                                      OfflineStore.saveThemeIndex(context, idx)
                                  },
                                  onOpenCategoryManager = { showCategoryDialog = true },
                                  onImportItems = { importedList ->
                                      val merged = allItems.toMutableList()
                                      importedList.forEach { item ->
                                          merged.add(item)
                                          AlarmScheduler.scheduleReminders(context, item)
                                      }
                                      persistItems(merged)
                                      Toast.makeText(context, "Imported ${importedList.size} events!", Toast.LENGTH_SHORT).show()
                                  }
                              )
                          }
                      }

                      if (showAddOrEditDialog) {
                          AddOrEditScheduleDialog(
                              initialItem = editingItem,
                              categories = categories,
                              venues = venues,
                              theme = currentTheme,
                              onManageCategories = { showCategoryDialog = true },
                              onAddVenue = { newVenue ->
                                  if (newVenue.isNotBlank() && venues.none { it.equals(newVenue, ignoreCase = true) }) {
                                      persistVenues(venues + newVenue.trim())
                                  }
                              },
                              onDismiss = { showAddOrEditDialog = false },
                              onSave = { savedItem ->
                                  val updatedList = if (editingItem == null) {
                                      allItems + savedItem
                                  } else {
                                      allItems.map { if (it.id == savedItem.id) savedItem else it }
                                  }
                                  persistItems(updatedList)
                                  AlarmScheduler.scheduleReminders(context, savedItem)
                                  showAddOrEditDialog = false
                              }
                          )
                      }

                      if (showCategoryDialog) {
                          CategoryManagerDialog(
                              categories = categories,
                              theme = currentTheme,
                              onSaveCategories = { updated -> persistCategories(updated) },
                              onResetDefaults = { persistCategories(DEFAULT_CATEGORIES) },
                              onDismiss = { showCategoryDialog = false }
                          )
                      }
                  }
              }
          }

          // --- TAB 0: CYBER-GLOW SCHEDULE SCREEN ---
          @Composable
          fun ScheduleTabScreen(
              allItems: List<ScheduleItem>,
              categories: List<CategorySpec>,
              theme: AppThemeSpec,
              onOpenCategoryManager: () -> Unit,
              onCycleTheme: () -> Unit,
              onEdit: (ScheduleItem) -> Unit,
              onToggleActive: (ScheduleItem, Boolean) -> Unit,
              onTogglePin: (ScheduleItem) -> Unit,
              onDelete: (ScheduleItem) -> Unit
          ) {
              var selectedCategory by remember { mutableStateOf("All") }
              var searchQuery by remember { mutableStateOf("") }
              var nowMillis by remember { mutableStateOf(System.currentTimeMillis()) }

              LaunchedEffect(Unit) {
                  while (true) {
                      delay(1000L)
                      nowMillis = System.currentTimeMillis()
                  }
              }

              val categoryColorMap = remember(categories) {
                  categories.associate { it.name to Color(it.colorHex) }
              }

              val filteredItems = remember(allItems, selectedCategory, searchQuery) {
                  allItems.filter { item ->
                      val matchesCat = selectedCategory == "All" || item.category == selectedCategory
                      val matchesSearch = searchQuery.isBlank() ||
                          item.title.contains(searchQuery, ignoreCase = true) ||
                          item.location.contains(searchQuery, ignoreCase = true) ||
                          item.notes.contains(searchQuery, ignoreCase = true)
                      matchesCat && matchesSearch
                  }
              }

              val nextUpcoming = remember(allItems, nowMillis) {
                  allItems
                      .filter { it.isReminderActive && !it.isCompleted }
                      .map { item ->
                          val effectiveTime = if (item.recurringDays.isNotBlank()) {
                              AlarmScheduler.computeNextRecurringMillis(item.hour, item.minute, item.recurringDays, nowMillis)
                          } else {
                              item.eventTimeMillis
                          }
                          item.copy(eventTimeMillis = effectiveTime)
                      }
                      .filter { it.eventTimeMillis > nowMillis }
                      .minByOrNull { it.eventTimeMillis }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp)
              ) {
                  // Top Brand Bar with Quick Theme Switcher & Category Button
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(top = 14.dp, bottom = 10.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Box(
                              modifier = Modifier
                                  .size(32.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(Brush.linearGradient(listOf(theme.primary, theme.secondary))),
                              contentAlignment = Alignment.Center
                          ) {
                              Text("Z", color = Color.White, fontWeight = FontWeight.ExtraBold, fontSize = 17.sp)
                          }
                          Column {
                              Text("taskz", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = Color.White)
                              Text(theme.name, fontSize = 10.sp, color = theme.secondary)
                          }
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(
                              onClick = onOpenCategoryManager,
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp),
                              shape = RoundedCornerShape(50),
                              border = BorderStroke(1.dp, theme.primary.copy(alpha = 0.6f))
                          ) {
                              Icon(Icons.Default.Edit, contentDescription = null, modifier = Modifier.size(14.dp), tint = theme.secondary)
                              Spacer(modifier = Modifier.width(4.dp))
                              Text("Categories", fontSize = 11.sp, color = Color.White)
                          }
                          IconButton(
                              onClick = onCycleTheme,
                              modifier = Modifier
                                  .size(34.dp)
                                  .clip(CircleShape)
                                  .background(theme.cardSurface)
                          ) {
                              Icon(Icons.Default.Refresh, contentDescription = "Switch Theme", tint = theme.secondary, modifier = Modifier.size(16.dp))
                          }
                      }
                  }

                  // Glassmorphic Gradient Hero Countdown Card
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(bottom = 14.dp)
                          .clip(RoundedCornerShape(28.dp))
                          .background(
                              Brush.linearGradient(
                                  colors = listOf(
                                      theme.primary.copy(alpha = 0.24f),
                                      theme.secondary.copy(alpha = 0.10f),
                                      theme.cardSurface
                                  )
                              )
                          )
                          .border(
                              width = 1.2.dp,
                              brush = Brush.linearGradient(listOf(theme.primary.copy(alpha = 0.8f), theme.secondary.copy(alpha = 0.3f))),
                              shape = RoundedCornerShape(28.dp)
                          )
                          .padding(vertical = 20.dp, horizontal = 20.dp)
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          if (nextUpcoming != null) {
                              val diffSec = ((nextUpcoming.eventTimeMillis - nowMillis) / 1000).coerceAtLeast(0)
                              val days = diffSec / (3600 * 24)
                              val hrs = (diffSec % (3600 * 24)) / 3600
                              val mins = (diffSec % 3600) / 60
                              val secs = diffSec % 60
                              val timeText = if (days > 0) {
                                  String.format("Next in %dd %02dh %02dm", days, hrs, mins)
                              } else {
                                  String.format("Next in %02dh %02dm %02ds", hrs, mins, secs)
                              }

                              Text(
                                  text = "UPCOMING EVENT",
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = theme.secondary
                              )
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(
                                  text = timeText,
                                  fontSize = 28.sp,
                                  fontWeight = FontWeight.Light,
                                  color = Color.White
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(
                                  text = "${nextUpcoming.title} • ${nextUpcoming.location}",
                                  fontSize = 14.sp,
                                  color = Color.White.copy(alpha = 0.9f),
                                  fontWeight = FontWeight.SemiBold
                              )
                          } else {
                              Text(
                                  text = "ALL CAUGHT UP",
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = theme.secondary
                              )
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(
                                  text = "No Pending Alarms",
                                  fontSize = 26.sp,
                                  fontWeight = FontWeight.Light,
                                  color = Color.White
                              )
                              Text(
                                  text = "2-hour & 15-min offline reminders armed",
                                  fontSize = 12.sp,
                                  color = Color.Gray
                              )
                          }
                      }
                  }

                  // Search Bar
                  OutlinedTextField(
                      value = searchQuery,
                      onValueChange = { searchQuery = it },
                      placeholder = { Text("Search event, venue, category, or notes...", fontSize = 13.sp) },
                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, tint = theme.secondary) },
                      trailingIcon = {
                          if (searchQuery.isNotEmpty()) {
                              IconButton(onClick = { searchQuery = "" }) {
                                  Icon(Icons.Default.Close, contentDescription = "Clear", tint = Color.Gray)
                              }
                          }
                      },
                      singleLine = true,
                      shape = RoundedCornerShape(50),
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(bottom = 12.dp)
                  )

                  // Customizable Category Filter Pills + "+ Custom" Button
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .horizontalScroll(rememberScrollState())
                          .padding(bottom = 14.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      val allTabs = listOf(CategorySpec("All", theme.primary.value.toLong())) + categories
                      allTabs.forEach { catSpec ->
                          val isSelected = catSpec.name == selectedCategory
                          val catColor = if (catSpec.name == "All") theme.primary else Color(catSpec.colorHex)
                          val bg by animateColorAsState(if (isSelected) catColor else theme.cardSurface)

                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(50))
                                  .background(bg)
                                  .border(
                                      width = 1.dp,
                                      color = if (isSelected) Color.White.copy(alpha = 0.4f) else catColor.copy(alpha = 0.35f),
                                      shape = RoundedCornerShape(50)
                                  )
                                  .clickable { selectedCategory = catSpec.name }
                                  .padding(horizontal = 15.dp, vertical = 8.dp)
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  if (catSpec.name != "All") {
                                      Box(
                                          modifier = Modifier
                                              .size(7.dp)
                                              .clip(CircleShape)
                                              .background(if (isSelected) Color.White else catColor)
                                      )
                                  }
                                  Text(
                                      text = catSpec.name,
                                      color = Color.White,
                                      fontSize = 13.sp,
                                      fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Medium
                                  )
                              }
                          }
                      }

                      // Quick "+ Category" Pill
                      Box(
                          modifier = Modifier
                              .clip(RoundedCornerShape(50))
                              .background(theme.cardSurface)
                              .border(1.dp, theme.secondary.copy(alpha = 0.5f), RoundedCornerShape(50))
                              .clickable { onOpenCategoryManager() }
                              .padding(horizontal = 14.dp, vertical = 8.dp)
                      ) {
                          Text("+ Customize", color = theme.secondary, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      }
                  }

                  LazyColumn(
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                      contentPadding = PaddingValues(bottom = 90.dp)
                  ) {
                      items(filteredItems, key = { it.id }) { item ->
                          val catColor = categoryColorMap[item.category] ?: theme.primary
                          TaskzScheduleCard(
                              item = item,
                              categoryColor = catColor,
                              theme = theme,
                              onClick = { onEdit(item) },
                              onToggle = { enabled -> onToggleActive(item, enabled) },
                              onPin = { onTogglePin(item) },
                              onDelete = { onDelete(item) }
                          )
                      }
                  }
              }
          }

          @Composable
          fun TaskzScheduleCard(
              item: ScheduleItem,
              categoryColor: Color,
              theme: AppThemeSpec,
              onClick: () -> Unit,
              onToggle: (Boolean) -> Unit,
              onPin: () -> Unit,
              onDelete: () -> Unit
          ) {
              val timeFormatter = remember { SimpleDateFormat("hh:mm a", Locale.getDefault()) }
              val dateFormatter = remember { SimpleDateFormat("EEE, dd MMM", Locale.getDefault()) }
              val textAlpha = if (item.isReminderActive && !item.isCompleted) 1f else 0.45f

              val accentColor = when (item.priority) {
                  "Urgent" -> Color(0xFFFF453A)
                  "High" -> Color(0xFFFF9F0A)
                  else -> categoryColor
              }

              val activeRecurringSet = remember(item.recurringDays) {
                  item.recurringDays.split(",").mapNotNull { it.trim().toIntOrNull() }.toSet()
              }
              val weekDays = listOf(1 to "S", 2 to "M", 3 to "T", 4 to "W", 5 to "T", 6 to "F", 7 to "S")

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(26.dp))
                      .background(
                          Brush.horizontalGradient(
                              colors = listOf(
                                  accentColor.copy(alpha = if (item.isReminderActive) 0.16f else 0.05f),
                                  theme.cardSurface,
                                  theme.cardSurface
                              )
                          )
                      )
                      .border(
                          width = if (item.isPinned) 1.5.dp else 1.dp,
                          color = if (item.isPinned) accentColor.copy(alpha = 0.85f) else Color.White.copy(alpha = 0.07f),
                          shape = RoundedCornerShape(26.dp)
                      )
                      .clickable { onClick() }
              ) {
                  Row(
                      modifier = Modifier
                          .padding(horizontal = 18.dp, vertical = 16.dp)
                          .fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              Box(
                                  modifier = Modifier
                                      .size(8.dp)
                                      .clip(CircleShape)
                                      .background(categoryColor)
                              )
                              Text(
                                  text = "${item.category} • ${item.location}",
                                  color = categoryColor.copy(alpha = textAlpha),
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.SemiBold
                              )
                              if (item.priority != "Normal") {
                                  Text(
                                      text = "[${item.priority}]",
                                      color = accentColor.copy(alpha = textAlpha),
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }

                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = timeFormatter.format(Date(item.eventTimeMillis)),
                              color = Color.White.copy(alpha = textAlpha),
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Light
                          )
                          Text(
                              text = item.title,
                              color = Color.White.copy(alpha = textAlpha),
                              fontSize = 16.sp,
                              fontWeight = FontWeight.SemiBold,
                              textDecoration = if (item.isCompleted) TextDecoration.LineThrough else TextDecoration.None
                          )

                          if (item.notes.isNotBlank()) {
                              Text(
                                  text = item.notes,
                                  color = Color.LightGray.copy(alpha = 0.78f * textAlpha),
                                  fontSize = 12.sp,
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis,
                                  modifier = Modifier.padding(top = 2.dp)
                              )
                          }

                          Spacer(modifier = Modifier.height(6.dp))
                          val alertBadge = if (item.alert15MinPrior) "2h + 15m alerts" else "2h alert"
                          if (activeRecurringSet.isNotEmpty()) {
                              Row(horizontalArrangement = Arrangement.spacedBy(5.dp), verticalAlignment = Alignment.CenterVertically) {
                                  weekDays.forEach { (dayNum, label) ->
                                      val isDaySelected = dayNum in activeRecurringSet
                                      Text(
                                          text = label,
                                          fontSize = 12.sp,
                                          fontWeight = if (isDaySelected) FontWeight.Bold else FontWeight.Normal,
                                          color = when {
                                              isDaySelected -> categoryColor.copy(alpha = textAlpha)
                                              dayNum == 1 -> Color(0xFFFF453A).copy(alpha = 0.5f * textAlpha)
                                              else -> Color.Gray.copy(alpha = 0.5f * textAlpha)
                                          }
                                      )
                                  }
                                  Text(text = " • $alertBadge", color = Color.Gray.copy(alpha = textAlpha), fontSize = 11.sp)
                              }
                          } else {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Icon(
                                      Icons.Default.Notifications,
                                      contentDescription = null,
                                      tint = theme.secondary.copy(alpha = textAlpha),
                                      modifier = Modifier.size(13.dp)
                                  )
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text(
                                      text = "${dateFormatter.format(Date(item.eventTimeMillis))} • $alertBadge",
                                      color = Color.Gray.copy(alpha = textAlpha),
                                      fontSize = 12.sp
                                  )
                              }
                          }
                      }

                      Column(horizontalAlignment = Alignment.End) {
                          Switch(
                              checked = item.isReminderActive,
                              onCheckedChange = onToggle,
                              colors = SwitchDefaults.colors(
                                  checkedThumbColor = Color.White,
                                  checkedTrackColor = categoryColor
                              )
                          )
                          Row {
                              IconButton(onClick = onPin, modifier = Modifier.size(32.dp)) {
                                  Icon(
                                      Icons.Default.Star,
                                      contentDescription = "Pin",
                                      tint = if (item.isPinned) Color(0xFFFFD60A) else Color.Gray.copy(alpha = 0.4f),
                                      modifier = Modifier.size(18.dp)
                                  )
                              }
                              IconButton(onClick = onDelete, modifier = Modifier.size(32.dp)) {
                                  Icon(
                                      Icons.Default.Delete,
                                      contentDescription = "Delete",
                                      tint = Color.Gray,
                                      modifier = Modifier.size(18.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }

          // --- DIALOG: CUSTOM CATEGORY MANAGER (ADD / COLOR PICK / DELETE / RESET) ---
          @Composable
          fun CategoryManagerDialog(
              categories: List<CategorySpec>,
              theme: AppThemeSpec,
              onSaveCategories: (List<CategorySpec>) -> Unit,
              onResetDefaults: () -> Unit,
              onDismiss: () -> Unit
          ) {
              var newCatName by remember { mutableStateOf("") }
              var selectedColor by remember { mutableStateOf(CATEGORY_COLOR_PALETTE.first()) }
              var localList by remember(categories) { mutableStateOf(categories) }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = theme.cardSurface,
                  title = {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("Customize Categories", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                          TextButton(onClick = {
                              localList = DEFAULT_CATEGORIES
                              onResetDefaults()
                          }) {
                              Text("Reset", color = theme.secondary, fontSize = 12.sp)
                          }
                      }
                  },
                  text = {
                      Column(
                          modifier = Modifier.verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Text("Create a New Category:", color = Color.Gray, fontSize = 12.sp)
                          OutlinedTextField(
                              value = newCatName,
                              onValueChange = { newCatName = it },
                              label = { Text("Category Name (e.g., Gym, XLR8, Exams)") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )

                          // Color Picker Row
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              CATEGORY_COLOR_PALETTE.forEach { hex ->
                                  val isSelected = selectedColor == hex
                                  Box(
                                      modifier = Modifier
                                          .size(32.dp)
                                          .clip(CircleShape)
                                          .background(Color(hex))
                                          .border(
                                              width = if (isSelected) 3.dp else 0.dp,
                                              color = if (isSelected) Color.White else Color.Transparent,
                                              shape = CircleShape
                                          )
                                          .clickable { selectedColor = hex }
                                  )
                              }
                          }

                          Button(
                              onClick = {
                                  val trimmed = newCatName.trim()
                                  if (trimmed.isNotEmpty() && localList.none { it.name.equals(trimmed, ignoreCase = true) }) {
                                      val updated = localList + CategorySpec(trimmed, selectedColor)
                                      localList = updated
                                      onSaveCategories(updated)
                                      newCatName = ""
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = theme.primary),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Icon(Icons.Default.Add, contentDescription = null, modifier = Modifier.size(16.dp))
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("Add Category", color = Color.White)
                          }

                          Divider(color = Color.White.copy(alpha = 0.1f))
                          Text("Your Active Categories (${localList.size}):", color = Color.Gray, fontSize = 12.sp)

                          localList.forEach { cat ->
                              Surface(
                                  shape = RoundedCornerShape(14.dp),
                                  color = Color(0xFF0B0D14),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Row(
                                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                          Box(
                                              modifier = Modifier
                                                  .size(12.dp)
                                                  .clip(CircleShape)
                                                  .background(Color(cat.colorHex))
                                          )
                                          Text(cat.name, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Medium)
                                      }
                                      if (localList.size > 1) {
                                          IconButton(
                                              onClick = {
                                                  val updated = localList.filterNot { it.name == cat.name }
                                                  localList = updated
                                                  onSaveCategories(updated)
                                              },
                                              modifier = Modifier.size(28.dp)
                                          ) {
                                              Icon(Icons.Default.Delete, contentDescription = "Delete", tint = Color(0xFFFF453A), modifier = Modifier.size(16.dp))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = onDismiss,
                          colors = ButtonDefaults.buttonColors(containerColor = theme.primary)
                      ) {
                          Text("Done", color = Color.White)
                      }
                  }
              )
          }

          // --- TAB 1: TASKS & SUB-CHECKLIST SCREEN ---
          @Composable
          fun TasksChecklistScreen(
              allItems: List<ScheduleItem>,
              categories: List<CategorySpec>,
              theme: AppThemeSpec,
              onToggleComplete: (ScheduleItem) -> Unit,
              onClearCompleted: () -> Unit,
              onEdit: (ScheduleItem) -> Unit
          ) {
              val completedCount = allItems.count { it.isCompleted }
              val totalCount = allItems.size
              val progress = if (totalCount > 0) completedCount.toFloat() / totalCount else 0f
              val categoryColorMap = remember(categories) { categories.associate { it.name to Color(it.colorHex) } }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp, vertical = 20.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text("taskz Checklist", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                          Text("$completedCount of $totalCount completed", fontSize = 13.sp, color = theme.secondary)
                      }
                      if (completedCount > 0) {
                          TextButton(onClick = onClearCompleted) {
                              Text("Clear Done", color = Color(0xFFFF453A))
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(12.dp))
                  LinearProgressIndicator(
                      progress = { progress },
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(8.dp)
                          .clip(RoundedCornerShape(50)),
                      color = theme.secondary,
                      trackColor = theme.cardSurface
                  )
                  Spacer(modifier = Modifier.height(18.dp))

                  LazyColumn(
                      verticalArrangement = Arrangement.spacedBy(10.dp),
                      contentPadding = PaddingValues(bottom = 90.dp)
                  ) {
                      items(allItems, key = { it.id }) { item ->
                          val catColor = categoryColorMap[item.category] ?: theme.primary
                          Surface(
                              shape = RoundedCornerShape(22.dp),
                              color = theme.cardSurface,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .border(1.dp, catColor.copy(alpha = 0.25f), RoundedCornerShape(22.dp))
                                  .clickable { onEdit(item) }
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Checkbox(
                                      checked = item.isCompleted,
                                      onCheckedChange = { onToggleComplete(item) }
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(
                                          text = item.title,
                                          color = if (item.isCompleted) Color.Gray else Color.White,
                                          fontSize = 16.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          textDecoration = if (item.isCompleted) TextDecoration.LineThrough else TextDecoration.None
                                      )
                                      Text(
                                          text = "${item.category} • ${item.location} • ${item.priority}",
                                          color = catColor,
                                          fontSize = 12.sp
                                      )
                                      if (item.notes.isNotBlank()) {
                                          Text(text = item.notes, color = Color.Gray, fontSize = 12.sp, maxLines = 1)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // --- TAB 2: FOCUS TIMER & LAB STOPWATCH ---
          @Composable
          fun FocusAndStopwatchScreen(theme: AppThemeSpec) {
              var selectedDurationSec by remember { mutableStateOf(25 * 60) }
              var remainingSec by remember { mutableStateOf(25 * 60) }
              var isTimerRunning by remember { mutableStateOf(false) }

              var stopwatchMillis by remember { mutableStateOf(0L) }
              var isStopwatchRunning by remember { mutableStateOf(false) }
              val laps = remember { mutableStateListOf<String>() }

              LaunchedEffect(isTimerRunning) {
                  while (isTimerRunning && remainingSec > 0) {
                      delay(1000L)
                      remainingSec--
                  }
                  if (remainingSec == 0) isTimerRunning = false
              }

              LaunchedEffect(isStopwatchRunning) {
                  while (isStopwatchRunning) {
                      delay(100L)
                      stopwatchMillis += 100L
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Surface(
                      shape = RoundedCornerShape(28.dp),
                      color = theme.cardSurface,
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, theme.primary.copy(alpha = 0.35f), RoundedCornerShape(28.dp))
                  ) {
                      Column(
                          modifier = Modifier.padding(24.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text("Focus & Coding Timer", color = theme.secondary, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                          Spacer(modifier = Modifier.height(10.dp))

                          val mins = remainingSec / 60
                          val secs = remainingSec % 60
                          Text(
                              text = String.format("%02d:%02d", mins, secs),
                              fontSize = 54.sp,
                              fontWeight = FontWeight.Light,
                              color = Color.White
                          )

                          Spacer(modifier = Modifier.height(12.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              listOf(25 to "25m Study", 50 to "50m CAD/Code", 90 to "90m Lab").forEach { (m, label) ->
                                  FilterChip(
                                      selected = selectedDurationSec == m * 60,
                                      onClick = {
                                          isTimerRunning = false
                                          selectedDurationSec = m * 60
                                          remainingSec = m * 60
                                      },
                                      label = { Text(label, fontSize = 12.sp) }
                                  )
                              }
                          }

                          Spacer(modifier = Modifier.height(14.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              Button(
                                  onClick = { isTimerRunning = !isTimerRunning },
                                  colors = ButtonDefaults.buttonColors(containerColor = theme.primary)
                              ) {
                                  Text(if (isTimerRunning) "Pause" else "Start Focus", color = Color.White)
                              }
                              OutlinedButton(
                                  onClick = {
                                      isTimerRunning = false
                                      remainingSec = selectedDurationSec
                                  }
                              ) {
                                  Text("Reset")
                              }
                          }
                      }
                  }

                  Surface(
                      shape = RoundedCornerShape(28.dp),
                      color = theme.cardSurface,
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, theme.secondary.copy(alpha = 0.3f), RoundedCornerShape(28.dp))
                  ) {
                      Column(
                          modifier = Modifier.padding(24.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text("Lab & Run Stopwatch", color = theme.secondary, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                          Spacer(modifier = Modifier.height(10.dp))

                          val totalSec = stopwatchMillis / 1000
                          val m = totalSec / 60
                          val s = totalSec % 60
                          val tenth = (stopwatchMillis % 1000) / 100
                          Text(
                              text = String.format("%02d:%02d.%d", m, s, tenth),
                              fontSize = 46.sp,
                              fontWeight = FontWeight.Light,
                              color = Color.White
                          )

                          Spacer(modifier = Modifier.height(14.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              Button(
                                  onClick = { isStopwatchRunning = !isStopwatchRunning },
                                  colors = ButtonDefaults.buttonColors(containerColor = theme.primary)
                              ) {
                                  Text(if (isStopwatchRunning) "Stop" else "Start", color = Color.White)
                              }
                              OutlinedButton(
                                  onClick = {
                                      if (stopwatchMillis > 0L) {
                                          laps.add(0, "Lap ${laps.size + 1}: " + String.format("%02d:%02d.%d", m, s, tenth))
                                      }
                                  }
                              ) {
                                  Text("Lap")
                              }
                              OutlinedButton(
                                  onClick = {
                                      isStopwatchRunning = false
                                      stopwatchMillis = 0L
                                      laps.clear()
                                  }
                              ) {
                                  Text("Reset")
                              }
                          }

                          if (laps.isNotEmpty()) {
                              Spacer(modifier = Modifier.height(12.dp))
                              laps.take(5).forEach { lap ->
                                  Text(lap, color = Color.LightGray, fontSize = 13.sp)
                              }
                          }
                      }
                  }
              }
          }

          // --- TAB 3: THEME CUSTOMIZER, CATEGORY EDITOR & JSON BACKUP ---
          @Composable
          fun CustomizeAndBackupScreen(
              allItems: List<ScheduleItem>,
              categories: List<CategorySpec>,
              themeIndex: Int,
              theme: AppThemeSpec,
              onSelectTheme: (Int) -> Unit,
              onOpenCategoryManager: () -> Unit,
              onImportItems: (List<ScheduleItem>) -> Unit
          ) {
              val context = LocalContext.current
              val clipboard = LocalClipboardManager.current
              var importJsonText by remember { mutableStateOf("") }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text("Customize taskz & Sync", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      StatBox("Active", allItems.count { it.isReminderActive && !it.isCompleted }.toString(), theme, Modifier.weight(1f))
                      StatBox("Pinned", allItems.count { it.isPinned }.toString(), theme, Modifier.weight(1f))
                      StatBox("Done", allItems.count { it.isCompleted }.toString(), theme, Modifier.weight(1f))
                  }

                  // Theme Picker Card
                  Surface(
                      shape = RoundedCornerShape(24.dp),
                      color = theme.cardSurface,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text("AMOLED Glow Theme", color = theme.secondary, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                          APP_THEMES.forEachIndexed { idx, spec ->
                              val selected = idx == themeIndex
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(14.dp))
                                      .background(if (selected) spec.primary.copy(alpha = 0.2f) else Color(0xFF0B0D14))
                                      .border(
                                          width = 1.dp,
                                          color = if (selected) spec.secondary else Color.Transparent,
                                          shape = RoundedCornerShape(14.dp)
                                      )
                                      .clickable { onSelectTheme(idx) }
                                      .padding(12.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      Box(
                                          modifier = Modifier
                                              .size(20.dp)
                                              .clip(CircleShape)
                                              .background(Brush.linearGradient(listOf(spec.primary, spec.secondary)))
                                      )
                                      Text(spec.name, color = Color.White, fontWeight = FontWeight.Medium, fontSize = 14.sp)
                                  }
                                  if (selected) {
                                      Icon(Icons.Default.Check, contentDescription = null, tint = spec.secondary)
                                  }
                              }
                          }
                      }
                  }

                  // Category Breakdown & Editor Card
                  Surface(
                      shape = RoundedCornerShape(24.dp),
                      color = theme.cardSurface,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Custom Categories", color = theme.secondary, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                              TextButton(onClick = onOpenCategoryManager) {
                                  Text("+ Add / Edit", color = theme.primary)
                              }
                          }
                          categories.forEach { cat ->
                              val count = allItems.count { it.category == cat.name }
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Box(
                                          modifier = Modifier
                                              .size(10.dp)
                                              .clip(CircleShape)
                                              .background(Color(cat.colorHex))
                                      )
                                      Text(cat.name, color = Color.LightGray, fontSize = 14.sp)
                                  }
                                  Text("$count items", color = Color.White, fontWeight = FontWeight.Medium, fontSize = 14.sp)
                              }
                          }
                      }
                  }

                  // JSON Backup Card
                  Surface(
                      shape = RoundedCornerShape(24.dp),
                      color = theme.cardSurface,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text("Offline Backup & Laptop Sync", color = theme.secondary, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                          Button(
                              onClick = {
                                  val arr = JSONArray()
                                  allItems.forEach { item ->
                                      arr.put(JSONObject().apply {
                                          put("title", item.title)
                                          put("category", item.category)
                                          put("location", item.location)
                                          put("notes", item.notes)
                                          put("priority", item.priority)
                                          put("eventTimeMillis", item.eventTimeMillis)
                                          put("hour", item.hour)
                                          put("minute", item.minute)
                                          put("recurringDays", item.recurringDays)
                                      })
                                  }
                                  clipboard.setText(AnnotatedString(arr.toString()))
                                  Toast.makeText(context, "taskz JSON copied to clipboard!", Toast.LENGTH_SHORT).show()
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = theme.primary),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Text("Copy Backup JSON to Clipboard", color = Color.White)
                          }

                          OutlinedTextField(
                              value = importJsonText,
                              onValueChange = { importJsonText = it },
                              label = { Text("Paste Backup JSON Here to Restore") },
                              maxLines = 3,
                              modifier = Modifier.fillMaxWidth()
                          )

                          OutlinedButton(
                              onClick = {
                                  try {
                                      val arr = JSONArray(importJsonText.trim())
                                      val list = mutableListOf<ScheduleItem>()
                                      for (i in 0 until arr.length()) {
                                          val obj = arr.getJSONObject(i)
                                          list.add(
                                              ScheduleItem(
                                                  id = (System.currentTimeMillis() % 100000000).toInt() + i,
                                                  title = obj.optString("title", "Imported Event"),
                                                  category = obj.optString("category", categories.first().name),
                                                  location = obj.optString("location", "Campus"),
                                                  notes = obj.optString("notes", ""),
                                                  priority = obj.optString("priority", "Normal"),
                                                  eventTimeMillis = obj.optLong("eventTimeMillis", System.currentTimeMillis() + 3600000L),
                                                  hour = obj.optInt("hour", 12),
                                                  minute = obj.optInt("minute", 0),
                                                  recurringDays = obj.optString("recurringDays", "")
                                              )
                                          )
                                      }
                                      if (list.isNotEmpty()) {
                                          onImportItems(list)
                                          importJsonText = ""
                                      }
                                  } catch (_: Exception) {
                                      Toast.makeText(context, "Invalid JSON format", Toast.LENGTH_SHORT).show()
                                  }
                              },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Text("Restore from JSON")
                          }
                      }
                  }
              }
          }

