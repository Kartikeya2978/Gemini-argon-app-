                                      IconButton(onClick = { onAddVenue(location.trim()) }) {
                                          Icon(Icons.Default.Add, contentDescription = "Save Venue", tint = theme.secondary)
                                      }
                                  }
                              },
                              modifier = Modifier.fillMaxWidth()
                          )

                          Row(
                              modifier = Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              venues.forEach { venue ->
                                  FilterChip(
                                      selected = location == venue,
                                      onClick = { location = venue },
                                      label = { Text(venue, fontSize = 11.sp) }
                                  )
                              }
                          }

                          OutlinedTextField(
                              value = notes,
                              onValueChange = { notes = it },
                              label = { Text("Agenda / Notes / Parts Needed") },
                              maxLines = 2,
                              modifier = Modifier.fillMaxWidth()
                          )

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              OutlinedButton(
                                  onClick = { showTimePicker = true },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  val amPm = if (selectedHour >= 12) "PM" else "AM"
                                  val displayHr = if (selectedHour % 12 == 0) 12 else selectedHour % 12
                                  Text(String.format("%02d:%02d %s", displayHr, selectedMinute, amPm))
                              }

                              OutlinedButton(
                                  onClick = {
                                      selectedWeekDays.clear()
                                      showDatePicker = true
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Text(
                                      text = if (selectedWeekDays.isEmpty()) dateFormatter.format(Date(selectedDateMillis)) else "Weekly",
                                      maxLines = 1,
                                      fontSize = 12.sp
                                  )
                              }
                          }

                          Text("Repeat Weekly (Optional):", color = Color.Gray, fontSize = 12.sp)
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              weekDays.forEach { (dayNum, label) ->
                                  val isSelected = dayNum in selectedWeekDays
                                  Box(
                                      modifier = Modifier
                                          .size(34.dp)
                                          .clip(CircleShape)
                                          .background(if (isSelected) theme.primary else Color.Transparent)
                                          .border(
                                              width = 1.dp,
                                              color = if (isSelected) theme.secondary else Color(0xFF3A3A3C),
                                              shape = CircleShape
                                          )
                                          .clickable {
                                              if (isSelected) selectedWeekDays.remove(dayNum)
                                              else selectedWeekDays.add(dayNum)
                                          },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          text = label,
                                          color = if (isSelected) Color.White else Color.LightGray,
                                          fontWeight = FontWeight.SemiBold,
                                          fontSize = 12.sp
                                      )
                                  }
                              }
                          }

                          // Category Selector with "+ New Category" shortcut
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Category:", color = Color.Gray, fontSize = 12.sp)
                              TextButton(onClick = onManageCategories) {
                                  Text("+ Customize Categories", color = theme.secondary, fontSize = 12.sp)
                              }
                          }
                          Row(
                              modifier = Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              categories.forEach { catSpec ->
                                  FilterChip(
                                      selected = category == catSpec.name,
                                      onClick = { category = catSpec.name },
                                      label = { Text(catSpec.name) }
                                  )
                              }
                          }

                          Text("Priority:", color = Color.Gray, fontSize = 12.sp)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              listOf("Normal", "High", "Urgent").forEach { p ->
                                  FilterChip(
                                      selected = priority == p,
                                      onClick = { priority = p },
                                      label = { Text(p) }
                                  )
                              }
                          }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Also alert 15 mins prior", color = Color.White, fontSize = 13.sp)
                              Switch(checked = alert15MinPrior, onCheckedChange = { alert15MinPrior = it })
                          }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Pin to top of schedule", color = Color.White, fontSize = 13.sp)
                              Switch(checked = isPinned, onCheckedChange = { isPinned = it })
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = {
                              if (title.isNotBlank()) {
                                  val recurringCsv = selectedWeekDays.sorted().joinToString(",")
                                  val computedMillis = if (recurringCsv.isNotBlank()) {
                                      AlarmScheduler.computeNextRecurringMillis(selectedHour, selectedMinute, recurringCsv)
                                  } else {
                                      Calendar.getInstance().apply {
                                          timeInMillis = selectedDateMillis
                                          set(Calendar.HOUR_OF_DAY, selectedHour)
                                          set(Calendar.MINUTE, selectedMinute)
                                          set(Calendar.SECOND, 0)
                                          set(Calendar.MILLISECOND, 0)
                                      }.timeInMillis
                                  }

                                  onSave(
                                      ScheduleItem(
                                          id = initialItem?.id ?: (System.currentTimeMillis() % 100000000).toInt(),
                                          title = title.trim(),
                                          category = category,
                                          location = location.trim().ifBlank { "Campus" },
                                          notes = notes.trim(),
                                          priority = priority,
                                          eventTimeMillis = computedMillis,
                                          hour = selectedHour,
                                          minute = selectedMinute,
                                          recurringDays = recurringCsv,
                                          isReminderActive = true,
                                          alert15MinPrior = alert15MinPrior,
                                          isPinned = isPinned,
                                          isCompleted = initialItem?.isCompleted ?: false
                                      )
                                  )
                              }
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = theme.primary)
                      ) {
                          Text("Save & Arm Alerts", color = Color.White)
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("Cancel", color = Color.Gray) }
                  }
              )

              if (showDatePicker) {
                  val datePickerState = rememberDatePickerState(initialSelectedDateMillis = selectedDateMillis)
                  DatePickerDialog(
                      onDismissRequest = { showDatePicker = false },
                      confirmButton = {
                          TextButton(
                              onClick = {
                                  datePickerState.selectedDateMillis?.let { selectedDateMillis = it }
                                  showDatePicker = false
                              }
                          ) {
                              Text("OK")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDatePicker = false }) { Text("Cancel") }
                      }
                  ) {
                      DatePicker(state = datePickerState)
                  }
              }

              if (showTimePicker) {
                  val timePickerState = rememberTimePickerState(
                      initialHour = selectedHour,
                      initialMinute = selectedMinute,
                      is24Hour = false
                  )
                  AlertDialog(
                      onDismissRequest = { showTimePicker = false },
                      containerColor = theme.cardSurface,
                      title = { Text("Select Event Time", color = Color.White, fontSize = 16.sp) },
                      text = {
                          Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                              TimePicker(state = timePickerState)
                          }
                      },
                      confirmButton = {
                          TextButton(
                              onClick = {
                                  selectedHour = timePickerState.hour
                                  selectedMinute = timePickerState.minute
                                  showTimePicker = false
                              }
                          ) {
                              Text("OK")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showTimePicker = false }) { Text("Cancel") }
                      }
                  )
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: taskz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
