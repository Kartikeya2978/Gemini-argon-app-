              var selectedMinute by remember { mutableStateOf(initialItem?.minute ?: initialCal.get(Calendar.MINUTE)) }

              val selectedWeekDays = remember {
                  mutableStateListOf<Int>().apply {
                      initialItem?.recurringDays?.split(",")?.mapNotNull { it.trim().toIntOrNull() }?.let { addAll(it) }
                  }
              }
              val weekDays = listOf(1 to "S", 2 to "M", 3 to "T", 4 to "W", 5 to "T", 6 to "F", 7 to "S")

              var showDatePicker by remember { mutableStateOf(false) }
              var showTimePicker by remember { mutableStateOf(false) }
              val dateFormatter = remember { SimpleDateFormat("EEE, dd MMM yyyy", Locale.getDefault()) }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = theme.cardSurface,
                  title = {
                      Text(
                          text = if (initialItem == null) "New taskz Event" else "Edit taskz Event",
                          color = Color.White,
                          fontWeight = FontWeight.Bold
                      )
                  },
                  text = {
                      Column(
                          modifier = Modifier.verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          OutlinedTextField(
                              value = title,
                              onValueChange = { title = it },
                              label = { Text("Title (e.g., AUV Subsystem Sync)") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
