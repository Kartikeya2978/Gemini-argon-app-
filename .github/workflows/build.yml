              var title by remember { mutableStateOf(initialItem?.title ?: "") }
              var location by remember { mutableStateOf(initialItem?.location ?: venues.firstOrNull() ?: "AUV Lab") }
              var notes by remember { mutableStateOf(initialItem?.notes ?: "") }
              var category by remember { mutableStateOf(initialItem?.category ?: categories.first().name) }
              var priority by remember { mutableStateOf(initialItem?.priority ?: "Normal") }
              var alert15MinPrior by remember { mutableStateOf(initialItem?.alert15MinPrior ?: true) }
              var isPinned by remember { mutableStateOf(initialItem?.isPinned ?: false) }

              val initialCal = remember {
                  Calendar.getInstance().apply {
                      if (initialItem != null) timeInMillis = initialItem.eventTimeMillis
                      else add(Calendar.HOUR_OF_DAY, 3)
